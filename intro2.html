d<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Gourmet Menu Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top, #2c2c2c 0%, #121212 100%);
            color: #f8f9fa;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        h2 { font-weight: 700; letter-spacing: 2px; color: #ffffff; }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            transition: all 0.4s ease;
            opacity: 0; /* Used for animation */
            transform: translateY(20px);
        }

        .card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            transform: translateY(-12px);
            background: rgba(255, 255, 255, 0.08);
            border-color: #ff4d4d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        img {
            height: 220px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-danger { background-color: #ff4d4d; border: none; border-radius: 30px; font-weight: 600; }
        .btn-outline-danger { color: #ff4d4d; border-color: #ff4d4d; border-radius: 30px; }
        .btn-outline-danger:hover { background-color: #ff4d4d; border-color: #ff4d4d; }

        .price-tag { font-size: 1.25rem; color: #ff4d4d; font-weight: 700; }
        .card-text { color: #b0b0b0; font-size: 0.9rem; }
       
          /* navbar */
        .navbar {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(5px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff4d4d;
        }
        .navbar .logo span { color: #ffffff; }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }
        .nav-links li a {
            color: #f8f9fa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        .nav-links li a:hover { color: #ff4d4d; }
        .btn-dine {
            background-color: #ff4d4d;
            color: #ffffff;
            border-radius: 30px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
        }
        .sticky-top {
            position: sticky;
            top: 0;
        }

    </style>
</head>
<body>
     <nav class="navbar" id="navbar">
        <div class="logo">CAFE<span>FLAVOR</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="intro2.html">Menu</a></li>
            <li><a href="aboutus.html">About Us</a></li>
            <li><a href="dine.html" class="btn-dine">Dine In</a></li>
        </ul>
    </nav>

    <div class="container mt-5">
        <div class="text-center mb-5">
            <h2 class="display-5">Our Delicious Menu</h2>
            <p class="text-muted">Freshly prepared ingredients delivered to your door</p>
        </div>
        
        <div id="filter-buttons" class="d-flex justify-content-center flex-wrap gap-2 mb-5 sticky-top py-3" style="background: rgba(26,26,26,0.8); backdrop-filter: blur(5px); z-index: 1000;">
            <button type="button" class="btn btn-danger" data-filter="ALL">ALL</button>
            <button type="button" class="btn btn-outline-danger" data-filter="STARTER">STARTER</button>
            <button type="button" class="btn btn-outline-danger" data-filter="PIZZA">PIZZA</button>
            <button type="button" class="btn btn-outline-danger" data-filter="BURGER">BURGER</button>
            <button type="button" class="btn btn-outline-danger" data-filter="SPAGHETTI">SPAGHETTI</button>
            <button type="button" class="btn btn-outline-danger" data-filter="BEVERAGE">BEVERAGE</button>
            <button type="button" class="btn btn-outline-danger" data-filter="ICE-CREAM">ICE-CREAM</button>
        </div>
    </div>

    <div class="container mb-5">
        <div id="menu-grid" class="row g-4">
            </div>
    </div>

    <script>
        const menuItems = [
            // STARTERS
            { name: 'Crispy Calamari Rings', category: 'STARTER', price: '249', img: 'https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?auto=format&fit=crop&w=800', desc: 'Golden fried squid served with a zesty lemon aioli.' },
            { name: 'Truffle Garlic Bread', category: 'STARTER', price: '189', img: 'bread.webp', desc: 'Warm baguette infused with garlic butter and truffle oil.' },
            { name: 'Spicy Buffalo Wings', category: 'STARTER', price: '299', img: 'https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=800', desc: 'Hand-tossed wings in a fiery habanero glaze.' },
            
            // PIZZA
            { name: 'Margherita Royale', category: 'PIZZA', price: '399', img: 'https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?auto=format&fit=crop&w=800', desc: 'San Marzano tomatoes, fresh buffalo mozzarella, and basil.' },
            { name: 'Pepperoni Inferno', category: 'PIZZA', price: '459', img: 'https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=800', desc: 'Double layer of pepperoni with chili flakes and honey drizzle.' },
            { name: 'Wild Mushroom Pizza', category: 'PIZZA', price: '429', img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800', desc: 'Earthy forest mushrooms with white truffle cream base.' },

            // BURGER
            { name: 'The Steakhouse Burger', category: 'BURGER', price: '349', img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800', desc: 'Aged beef patty, smoked bacon, and caramelized onions.' },
            { name: 'Crunchy Zinger Burger', category: 'BURGER', price: '289', img: 'zburger.avif', desc: 'Crispy fried chicken fillet with spicy slaw and mayo.' },
            { name: 'Plant-Based Power', category: 'BURGER', price: '319', img: 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800', desc: 'Beyond meat patty with avocado smash and vegan cheese.' },

            // SPAGHETTI
            { name: 'Prawn Aglio Olio', category: 'SPAGHETTI', price: '389', img: 'https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=800', desc: 'Succulent prawns tossed in garlic, olive oil, and chili.' },
            { name: 'Classic Carbonara', category: 'SPAGHETTI', price: '359', img: 'https://images.unsplash.com/photo-1612874742237-6526221588e3?auto=format&fit=crop&w=800', desc: 'Creamy egg-based sauce with crispy pancetta and parmesan.' },
            { name: 'Basil Pesto Pasta', category: 'SPAGHETTI', price: '329', img: 'https://images.unsplash.com/photo-1473093226795-af9932fe5856?auto=format&fit=crop&w=800', desc: 'Hand-crafted pesto with pine nuts and fresh garden basil.' },

            // BEVERAGE
            { name: 'Midnight Cold Brew', category: 'BEVERAGE', price: '189', img: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&w=800', desc: '12-hour steeped coffee served over artisanal ice.' },
            { name: 'Passionfruit Mojito', category: 'BEVERAGE', price: '219', img: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=800', desc: 'Refreshing mint and lime with a tropical passionfruit twist.' },
            { name: 'Blueberry Smoothie', category: 'BEVERAGE', price: '199', img: 'blueburry.jpg', desc: 'Antioxidant-rich blueberries blended with Greek yogurt.' },

            // ICE-CREAM
            { name: 'Belgian Chocolate', category: 'ICE-CREAM', price: '159', img: 'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&w=800', desc: 'Deep dark chocolate with roasted almond slivers.' },
            { name: 'Madagascar Vanilla', category: 'ICE-CREAM', price: '139', img: 'https://cookingjoyful.com/wp-content/uploads/2026/04/vanilla-bean-ice-cream.jpg', desc: 'Pure vanilla bean cream with a drizzle of salted caramel.' },
            { name: 'Summer Berry Sorbet', category: 'ICE-CREAM', price: '149', img: 'https://images.unsplash.com/photo-1488900128323-21503983a07e?auto=format&fit=crop&w=800', desc: 'Dairy-free blend of fresh raspberries and strawberries.' }
        ];

        const grid = document.getElementById('menu-grid');
        const buttons = document.querySelectorAll('#filter-buttons button');

        function updateMenu(category) {
            grid.innerHTML = ''; 

            const filtered = (category === 'ALL') 
                ? menuItems 
                : menuItems.filter(item => item.category === category);

            filtered.forEach((item, index) => {
                const cardHtml = `
                    <div class="col-md-6 col-lg-4">
                        <div class="card h-100" id="card-${index}">
                            <img src="${item.img}" class="card-img-top" alt="${item.name}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title text-white">${item.name}</h5>
                                <p class="card-text flex-grow-1">${item.desc}</p>
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <span class="price-tag">₹${item.price}</span>
                                    <button class="btn btn-danger btn-sm px-4">Order</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
                
                // Add staggered animation effect
                setTimeout(() => {
                    document.querySelectorAll('.card').forEach(c => c.classList.add('show'));
                }, 50);
            });

            // Smooth scroll to grid
            if(category !== 'ALL') {
                window.scrollTo({ top: grid.offsetTop - 150, behavior: 'smooth' });
            }
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => {
                    b.classList.remove('btn-danger');
                    b.classList.add('btn-outline-danger');
                });
                btn.classList.add('btn-danger');
                btn.classList.remove('btn-outline-danger');
                updateMenu(btn.getAttribute('data-filter'));
            });
        });

        updateMenu('ALL');
    </script>
</body>
</html>
