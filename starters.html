<head>
    <title>menu</title>
     <link rel="stylesheet" href="style2.css">
</head>
<body>
<section class="menu-section" id="menu">
    <div class="container">
        <h2 class="section-title">Our <span>Starters</span></h2>
        
        <div class="filter-buttons">
            <button class="filter-btn" data-target="all">All</button>
           <a href="starters.html" class="filter-btn active">Starters</a>
            <button class="filter-btn" data-target="burger">Burgers</button>
            <button class="filter-btn" data-target="pizza">Pizza</button>
            <button class="filter-btn" data-target="chinese">Chinese & Noodles</button>
            <button class="filter-btn" data-target="dosa">Dosa</button>
            <button class="filter-btn" data-target="beverages">Beverages</button>
        </div>

        <div class="menu-grid" id="menu-grid">
            <div class="menu-item" data-category="starters">
                <img src="panner.jfif" alt="Paneer Tikka">
                <div class="item-info">
                    <h3>Paneer Tikka</h3>
                    <p>Spicy grilled cottage Paneer with mint chutney.</p>
                    <span class="price">$3.02</span>
                </div>
            </div>
<div class="menu-item" data-category="burger">
    <div class="item-badge">Best Seller</div>
    <img src="cheese.jfif" alt="Classic Burger">
    <div class="item-info">
        <div class="item-header">
            <h3>cheese bites</h3>
            <span class="price">$11.05</span>
        </div>
        <p>cheese bites with red spicy sauce</p>
        
        <div class="item-action">
            <div class="quantity-controls">
                <button class="qty-btn minus">-</button>
                <span class="qty-number">1</span>
                <button class="qty-btn plus">+</button>
            </div>
            <button class="btn-select">Select</button>
        </div>
    </div>
</div>
    </div>
</section>

    </body>
